; Configuración PHP de producción para el Sistema de Subdirección
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; Carga masiva de planeaciones (el original no ajustaba max_file_uploads,
; cuyo valor por defecto es 20: los lotes de más de 20 PDF se truncaban)
file_uploads = On
upload_max_filesize = 15M
post_max_size = 200M
max_file_uploads = 100
max_input_time = 300
max_execution_time = 120
memory_limit = 256M

session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1

date.timezone = America/Mexico_City
default_charset = "UTF-8"

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
